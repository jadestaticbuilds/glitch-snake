<!doctype html>
<html lang="en">

<title>Glitch Snake | Jade Static Builds</title>

<style>

</style>

<body>
<main>
<h1>Glitch Snake</h1>
<div class="score"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span><span>Today: <span id="todayBest">0</span></span><span id="shieldState"></span></div>
<canvas id="game" width="400" height="400" aria-label="Glitch Snake game board"></canvas>
<div>
<button id="startBtn">Start</button>
<button id="dailyBtn" class="secondary">Today's board</button>
<button id="pauseBtn" class="secondary">Pause</button>
<button id="soundBtn" class="secondary">Sound: On</button>
</div>
<div class="pad" aria-label="Direction pad">
<span class="empty"></span><button data-dir="up" aria-label="Up">▲</button><span class="empty"></span>
<button data-dir="left" aria-label="Left">◀</button><button data-dir="down" aria-label="Down">▼</button><button data-dir="right" aria-label="Right">▶</button>
</div>
<p class="note" id="msg">Press Start. Every 5th bite is a glitch orb, worth 5 points and a bigger burst.</p>
<p class="note" id="history"></p>
<p class="note foot">A Jade Static Builds collab, built with Muse. No signup, no upload.</p>
</main>
<script>
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
// DPR-sharp rendering: the backing store scales with device pixels while
// all drawing code stays in 400x400 logical coordinates.
const DPR = Math.min(window.devicePixelRatio || 1, 3);
cv.width = 400 * DPR;
cv.height = 400 * DPR;
const N = 20, CELL = 20;
let snake, dir, dirQueue, food, score, eaten, glitch, running, paused;
let frenzy = false, bonusFoods = [], frenzyTick = 0;
let exploding = false, particles = [], explodeTimer = null, explodeFrame = 0;
let themeIndex = 0;
// Same original colours, just re-assigned on every bite: background, grid,
// snake, food, and accent all rotate through these four arrangements.
const themes = [
  {bg:'#06121c', grid:'rgba(0,240,255,.12)', a:'#00f0ff', b:'#ff2e88', food:'#ff2e88', orb:'#ffe259', accent:'#00f0ff'},
  {bg:'#12061c', grid:'rgba(255,46,136,.14)', a:'#ff2e88', b:'#00f0ff', food:'#00f0ff', orb:'#ffe259', accent:'#ff2e88'},
  {bg:'#041a12', grid:'rgba(255,226,89,.12)', a:'#ffe259', b:'#00f0ff', food:'#ff2e88', orb:'#00f0ff', accent:'#ffe259'},
  {bg:'#0d0d0d', grid:'rgba(234,252,255,.12)', a:'#eafcff', b:'#ff2e88', food:'#00f0ff', orb:'#ffe259', accent:'#eafcff'}
];
let best = 0;
try { best = parseInt(localStorage.getItem('gs-best') || '0', 10) || 0; } catch (e) {}
document.getElementById('best').textContent = best;

// --- Daily best: one best score per local day (gs-daily-best + gs-daily-date).
// A stale date resets the daily best in memory; it is persisted on game over.
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
let dailyBest = 0, dailyDate = todayStr();
try {
  const storedDate = localStorage.getItem('gs-daily-date');
  const storedBest = parseInt(localStorage.getItem('gs-daily-best') || '0', 10) || 0;
  if (storedDate === dailyDate) {
    dailyBest = storedBest;
  } else {
    dailyBest = 0;
    dailyDate = todayStr();
  }
} catch (e) { dailyBest = 0; dailyDate = todayStr(); }
function renderTodayBest() {
  document.getElementById('todayBest').textContent = dailyBest;
}
function updateDailyBest() {
  if (dailyDate !== todayStr()) {
    dailyBest = 0;
    dailyDate = todayStr();
  }
  if (score > dailyBest) {
    dailyBest = score;
    try {
      localStorage.setItem('gs-daily-best', String(dailyBest));
      localStorage.setItem('gs-daily-date', dailyDate);
    } catch (e) {}
  }
  renderTodayBest();
}
renderTodayBest();

// --- Sound: Web Audio only, no files, never required to play ---
let soundOn = true, audioCtx = null;
try { soundOn = localStorage.getItem('gs-sound') !== 'off'; } catch (e) {}
document.getElementById('soundBtn').textContent = soundOn ? 'Sound: On' : 'Sound: Off';
function playBlip(freq) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.09);
  } catch (e) {}
}

// --- Run history (local only) ---
let gamesPlayed = 0, runHistory = [];
try {
  gamesPlayed = parseInt(localStorage.getItem('gs-games') || '0', 10) || 0;
  runHistory = JSON.parse(localStorage.getItem('gs-history') || '[]');
  if (!Array.isArray(runHistory)) runHistory = [];
} catch (e) { gamesPlayed = 0; runHistory = []; }
function renderHistory() {
  const el = document.getElementById('history');
  if (!runHistory.length) {
    el.textContent = 'No runs yet. Your last 5 runs will appear here.';
    return;
  }
  const runs = runHistory.map(r => r.score + '/' + r.length).join(', ');
  el.textContent = 'Played: ' + gamesPlayed + '  •  Last runs (score/length): ' + runs;
}
function recordRun() {
  runHistory.push({ score: score, length: snake.length, date: todayStr() });
  runHistory = runHistory.slice(-5);
  gamesPlayed++;
  try {
    localStorage.setItem('gs-history', JSON.stringify(runHistory));
    localStorage.setItem('gs-games', String(gamesPlayed));
  } catch (e) {}
  renderHistory();
}

// --- Daily seed: the local date picks the food sequence, no server ---
let dailyMode = false, seededRng = null;
function seededRandom(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function todaySeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function gameRandom() { return dailyMode && seededRng ? seededRng() : Math.random(); }
function isOccupied(x, y) {
  return snake.some(s => s.x === x && s.y === y) ||
    bonusFoods.some(b => b.x === x && b.y === y) ||
    (food && food.x === x && food.y === y) ||
    (shieldTile && shieldTile.x === x && shieldTile.y === y);
}
function randomEmptyCell() {
  for (let tries = 0; tries < 400; tries++) {
    const c = { x: Math.floor(gameRandom() * N), y: Math.floor(gameRandom() * N) };
    if (!isOccupied(c.x, c.y)) return c;
  }
  return null;
}

// --- Shield power-up: blue diamond, shape-coded, not colour alone ---
// Spawn rule: after score 20, on every 15th normal (non-orb, non-frenzy)
// bite, if no shield tile is on the board and no shield is active.
// Shield bites do NOT touch the 5-bite gold orb cadence (eaten is untouched),
// and shield tiles never spawn during frenzy.
let shieldTile = null, shieldUntil = 0, shieldBites = 0;
function shieldActive() { return shieldUntil > 0 && Date.now() < shieldUntil; }
function placeShield() {
  const c = randomEmptyCell();
  if (c) shieldTile = c;
}
function updateShieldState() {
  document.getElementById('shieldState').textContent = shieldActive() ? '🛡 Shield' : '';
}

// --- Bite juice: hit-stop, particles, pitch rising with combo ---
let combo = 0, biteParticles = [], biteTimer = null;
function startBiteJuice(color, cellX, cellY) {
  biteParticles = [];
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    biteParticles.push({ x: cellX * CELL + CELL / 2, y: cellY * CELL + CELL / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color: color, life: 6 });
  }
  clearInterval(biteTimer);
  biteTimer = setInterval(() => {
    biteParticles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    biteParticles = biteParticles.filter(p => p.life > 0);
    draw();
    if (!biteParticles.length) clearInterval(biteTimer);
  }, 40);
}
let hitStopMs = 0;
// --- Delta-time game loop: ticks advance on accumulated real time, so the
// snake moves at the same speed on 60Hz, 90Hz and 120Hz screens. Delta is
// clamped at 250ms so a backgrounded tab never fast-forwards on return.
// Bites set a 60ms hit-stop, matching the old restartTimerAfterHitStop feel.
let lastFrame = 0, accMs = 0;
function tickInterval() { return Math.max(70, 150 - score * 3); }
function frame(t) {
  if (running && !paused && !exploding) {
    if (!lastFrame) lastFrame = t;
    let dt = t - lastFrame;
    lastFrame = t;
    if (dt > 250) dt = 250;
    if (hitStopMs > 0) {
      hitStopMs -= dt;
    } else {
      accMs += dt;
      const iv = tickInterval();
      let guard = 0;
      while (accMs >= iv && guard < 8) {
        step();
        accMs -= iv;
        guard++;
        if (!running || paused || exploding) break;
      }
      if (guard >= 8) accMs = 0;
    }
  } else {
    lastFrame = 0;
    accMs = 0;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function placeFood() {
  const c = randomEmptyCell();
  return c || { x: 0, y: 0 };
}
function placeBonusFoods() {
  const out = [];
  for (let tries = 0; tries < 400 && out.length < 3; tries++) {
    const c = { x: Math.floor(gameRandom() * N), y: Math.floor(gameRandom() * N) };
    if (snake.some(s => s.x === c.x && s.y === c.y)) continue;
    if (out.some(b => b.x === c.x && b.y === c.y)) continue;
    if (shieldTile && shieldTile.x === c.x && shieldTile.y === c.y) continue;
    out.push(c);
  }
  return out;
}
function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; dirQueue = [];
  score = 0; eaten = 0; glitch = 0; paused = false; themeIndex = 0;
  frenzy = false; bonusFoods = []; frenzyTick = 0; exploding = false;
  shieldTile = null; shieldUntil = 0; shieldBites = 0; combo = 0;
  biteParticles = []; clearInterval(biteTimer);
  food = placeFood();
  document.getElementById('score').textContent = '0';
  updateShieldState();
  document.getElementById('msg').textContent = 'Press Start. Walls wrap around, and every bite changes the colours. Every 5th bite is a gold glitch orb, worth 5 points, and it starts frenzy mode with 3 gold squares to eat.';
  draw();
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // Frenzy mode: the background cycles through all four colour themes
  // on every move, instead of changing only on a bite.
  if (frenzy) themeIndex = frenzyTick % themes.length;
  const t = themes[themeIndex];
  cv.style.borderColor = t.accent;
  ctx.fillStyle = t.bg; ctx.fillRect(0, 0, 400, 400);
  ctx.strokeStyle = t.grid;
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, 400); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(400, i*CELL); ctx.stroke();
  }
  // Food: theme food colour normally, theme orb colour for a glitch orb.
  // In frenzy, the single food is replaced by 3 gold bonus squares.
  if (frenzy) {
    ctx.fillStyle = '#ffe259';
    bonusFoods.forEach(b => ctx.fillRect(b.x*CELL+3, b.y*CELL+3, CELL-6, CELL-6));
  } else if (food) {
    const orb = (eaten + 1) % 5 === 0;
    ctx.fillStyle = orb ? t.orb : t.food;
    // glow
    ctx.save();
    ctx.shadowColor = orb ? t.orb : t.food; ctx.shadowBlur = 14;
    ctx.fillRect(food.x*CELL+3, food.y*CELL+3, CELL-6, CELL-6);
    ctx.restore();
  }
  // Shield tile: a blue diamond (shape-coded, not colour alone), drawn
  // only outside frenzy. While active, the board edge glows gold.
  if (!frenzy && shieldTile) {
    const cx = shieldTile.x * CELL + CELL / 2, cy = shieldTile.y * CELL + CELL / 2;
    ctx.fillStyle = '#38b6ff';
    ctx.beginPath();
    ctx.moveTo(cx, cy - 8); ctx.lineTo(cx + 8, cy); ctx.lineTo(cx, cy + 8); ctx.lineTo(cx - 8, cy);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); ctx.lineWidth = 1;
  }
  if (shieldActive()) {
    ctx.strokeStyle = '#ffe259'; ctx.lineWidth = 4;
    ctx.strokeRect(2, 2, 396, 396); ctx.lineWidth = 1;
  }
  // Snake, head brightest, body alternating the theme's two colours.
  // During the death explosion the snake is replaced by flying particles.
  if (exploding) {
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      const size = Math.max(2, CELL - 2 - explodeFrame * 0.5);
      ctx.fillRect(p.x - size/2, p.y - size/2, size, size);
    });
  } else {
    snake.forEach((s, i) => {
      if (i === 0) {
        // head glow
        ctx.save();
        ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
        ctx.restore();
      } else {
        ctx.fillStyle = i % 2 ? t.a : t.b;
        ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
      }
    });
  }
  // Bite particles, in the bitten food's colour.
  biteParticles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
  });
  // Glitch burst: shift a few horizontal slices for a few frames after eating.
  // The source rect is in device pixels (DPR-scaled backing store).
  if (glitch > 0) {
    for (let k = 0; k < 5; k++) {
      const y = Math.floor(Math.random() * N) * CELL;
      const dx = (Math.random() < .5 ? -1 : 1) * (4 + Math.floor(Math.random() * 14));
      ctx.drawImage(cv, 0, y * DPR, 400 * DPR, CELL * DPR, dx, y, 400, CELL);
    }
    glitch--;
  }
  if (!running && !exploding) {
    ctx.fillStyle = 'rgba(4,7,13,.72)'; ctx.fillRect(0, 0, 400, 400);
    ctx.fillStyle = '#eafcff'; ctx.font = '700 24px system-ui'; ctx.textAlign = 'center';
    if (paused) {
      ctx.fillText('Paused', 200, 180);
      ctx.font = '16px system-ui';
      ctx.fillText('Tap the board or Resume to keep glitching.', 200, 214);
    } else if (score > 0) {
      ctx.fillText('Game over. Score ' + score, 200, 168);
      ctx.font = '16px system-ui';
      ctx.fillText("Today's best: " + dailyBest + '   |   All-time: ' + best, 200, 200);
      ctx.fillText('The grid glitched you out.', 200, 230);
      ctx.fillText(dailyMode ? "Today's board. Press Start to play again." : 'Press Start to play again.', 200, 258);
    } else {
      ctx.fillText('Glitch Snake', 200, 168);
      ctx.font = '16px system-ui';
      ctx.fillText('Eat. Glitch. Repeat.', 200, 200);
      ctx.fillText("Today's best: " + dailyBest, 200, 230);
      ctx.fillText(dailyMode ? "Today's board. Press Start to play again." : 'Press Start to play again.', 200, 258);
    }
  }
}
function explode() {
  running = false;
  exploding = true; explodeFrame = 0;
  playBlip(110);
  const t = themes[themeIndex];
  particles = snake.map((s, i) => ({
    x: s.x*CELL + CELL/2, y: s.y*CELL + CELL/2,
    vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7,
    color: i === 0 ? '#ffffff' : (i % 2 ? t.a : t.b)
  }));
  document.getElementById('msg').textContent = 'Boom!';
  clearInterval(explodeTimer);
  explodeTimer = setInterval(() => {
    explodeFrame++;
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; });
    glitch = 5;
    draw();
    if (explodeFrame >= 28) {
      clearInterval(explodeTimer);
      exploding = false; running = false;
      shieldTile = null; shieldUntil = 0; updateShieldState();
      recordRun();
      if (score > best) {
        best = score;
        try { localStorage.setItem('gs-best', String(best)); } catch (e) {}
        document.getElementById('best').textContent = best;
      }
      updateDailyBest();
      document.getElementById('msg').textContent = 'Game over. Press Start to try again.';
      jsbFunRate('glitch-snake', document.getElementById('msg'));
      draw();
    }
  }, 40);
}
function step() {
  if (!running || paused || exploding) return;
  if (frenzy) frenzyTick++;
  if (shieldUntil > 0 && Date.now() >= shieldUntil) { shieldUntil = 0; updateShieldState(); }
  if (dirQueue.length) dir = dirQueue.shift();
  // Walls wrap: going off one side appears on the other side.
  const head = {
    x: (snake[0].x + dir.x + N) % N,
    y: (snake[0].y + dir.y + N) % N
  };
  const shieldEat = !frenzy && shieldTile && head.x === shieldTile.x && head.y === shieldTile.y;
  const bonusIndex = frenzy ? bonusFoods.findIndex(b => b.x === head.x && b.y === head.y) : -1;
  const willEat = !frenzy && food && head.x === food.x && head.y === food.y;
  const willGrow = willEat || bonusIndex >= 0;
  // The tail cell frees up on a non-eating move, so it is not a collision then.
  // A live shield lets the snake pass through its own tail briefly.
  const body = willGrow ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === head.x && s.y === head.y) && !shieldActive()) {
    explode(); return;
  }
  snake.unshift(head);
  if (shieldEat) {
    shieldTile = null;
    shieldUntil = Date.now() + 5000;
    updateShieldState();
    document.getElementById('msg').textContent = 'Shield! 5 seconds to pass through your tail.';
    playBlip(660);
  }
  if (bonusIndex >= 0) {
    bonusFoods.splice(bonusIndex, 1);
    score += 1; glitch = 7;
    startBiteJuice('#ffe259', head.x, head.y);
    document.getElementById('score').textContent = score;
    if (bonusFoods.length === 0) {
      frenzy = false;
      food = placeFood();
      document.getElementById('msg').textContent = 'Frenzy cleared! Score ' + score + '.';
    } else {
      document.getElementById('msg').textContent = 'Frenzy! ' + bonusFoods.length + ' bonus squares left.';
    }
    hitStopMs = 60;
  } else if (willEat) {
    eaten++;
    combo++;
    themeIndex = (themeIndex + 1) % themes.length;
    const orb = eaten % 5 === 0;
    const biteColor = orb ? themes[themeIndex].orb : themes[themeIndex].food;
    score += orb ? 5 : 1;
    glitch = orb ? 14 : 7;
    startBiteJuice(biteColor, head.x, head.y);
    playBlip(320 + Math.min(combo, 12) * 40);
    document.getElementById('score').textContent = score;
    if (orb) {
      // Frenzy mode: 3 random gold squares appear, and the background
      // cycles colours on every move until all 3 are eaten.
      frenzy = true; frenzyTick = 0; bonusFoods = placeBonusFoods(); food = null;
      document.getElementById('msg').textContent = 'Frenzy mode! Eat all 3 gold squares.';
    } else {
      document.getElementById('msg').textContent = 'Nice bite. Score ' + score + '.';
      // Shield cadence runs on normal bites only: it never changes eaten,
      // so the 5-bite gold orb cadence is untouched.
      shieldBites++;
      if (score >= 20 && shieldBites >= 15 && !shieldTile && !shieldActive()) {
        placeShield();
        shieldBites = 0;
        if (shieldTile) document.getElementById('msg').textContent = 'Nice bite. Score ' + score + '. A blue shield tile appeared!';
      }
      food = placeFood();
    }
    hitStopMs = 60;
  } else {
    snake.pop();
  }
  draw();
}
function start() {
  dailyMode = false; seededRng = null;
  reset(); running = true; paused = false;
  clearInterval(explodeTimer);
  accMs = 0; hitStopMs = 0; lastFrame = 0;
  document.getElementById('pauseBtn').textContent = 'Pause';
  document.getElementById('msg').textContent = 'Playing. Eat the pink squares, watch for the gold glitch orb. After score 20, a blue shield tile can appear.';
  draw();
}
function startDaily() {
  dailyMode = true; seededRng = seededRandom(todaySeed());
  reset(); running = true; paused = false;
  clearInterval(explodeTimer);
  accMs = 0; hitStopMs = 0; lastFrame = 0;
  document.getElementById('pauseBtn').textContent = 'Pause';
  document.getElementById('msg').textContent = "Today's board. Same starting food layout all day, on this device. No server, no upload.";
  draw();
}
function setDir(x, y, name) {
  // Queue turns instead of overwriting one direction with the next.
  // Before this fix, two fast turns in one tick collapsed into one:
  // right, then up, then left became just left, straight back into the body.
  // Now each turn is played in order, one per tick, up to 3 queued.
  const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if (last.x === -x && last.y === -y) return;
  if (last.x === x && last.y === y) return;
  if (dirQueue.length < 3) dirQueue.push({x, y});
}
const dirs = { up: [0,-1], left: [-1,0], down: [0,1], right: [1,0] };
document.querySelectorAll('.pad button').forEach(b => {
  // pointerdown, not click, so a thumb tap registers at touch time, not after.
  b.addEventListener('pointerdown', e => { e.preventDefault(); const d = dirs[b.dataset.dir]; setDir(d[0], d[1]); });
});
document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('dailyBtn').addEventListener('click', startDaily);
document.getElementById('soundBtn').addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('gs-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  document.getElementById('soundBtn').textContent = soundOn ? 'Sound: On' : 'Sound: Off';
});
document.getElementById('pauseBtn').addEventListener('click', () => {
  if (!running) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
  draw();
});
// Pause when the tab is hidden. The run is kept, not ended.
// Tap the board or Resume to continue.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && running && !paused && !exploding) {
    paused = true;
    document.getElementById('pauseBtn').textContent = 'Resume';
    draw();
  }
});
cv.addEventListener('click', () => {
  if (paused && running && !exploding) {
    paused = false;
    document.getElementById('pauseBtn').textContent = 'Pause';
    draw();
  }
});
document.addEventListener('keydown', e => {
  const k = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] }[e.key];
  if (k) { e.preventDefault(); setDir(k[0], k[1]); }
  if (e.key === ' ') { e.preventDefault(); if (!running) start(); }
});
// Swipe on the canvas. Pointer events cover touch, mouse and pen, so a
// desktop drag steers exactly like a phone swipe (canvas has
// touch-action:none, so no scroll gesture competes).
let sx = null, sy = null;
cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
cv.addEventListener('pointermove', e => {
  if (sx === null) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0); else setDir(0, dy > 0 ? 1 : -1);
  sx = null; sy = null;
});
cv.addEventListener('pointerup', () => { sx = null; sy = null; });
cv.addEventListener('pointercancel', () => { sx = null; sy = null; });
renderHistory();
reset();
</script>

<script>
/* fun-rating: 3 stars on game over, 3rd+ game over, once per session */
function jsbFunRate(slug, mountEl){
  if(!mountEl || mountEl.querySelector('.jsb-funrate')) return;
  var K = 'jsb-fun-' + slug;
  function ls(k, v){ try{ if(arguments.length===1) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
  function ss(k, v){ try{ if(arguments.length===1) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); }catch(e){ return null; } }
  var n = parseInt(ls(K+'-n')||'0', 10) + 1;
  ls(K+'-n', String(n));
  if(n < 3 || ss(K+'-s')) return;
  ss(K+'-s', '1');
  var box = document.createElement('div');
  box.className = 'jsb-funrate';
  box.innerHTML = '<div class="jsb-fr-q">fun?</div><div class="jsb-fr-stars">' +
    '<button type="button" data-s="1" aria-label="not fun">\u2605</button>' +
    '<button type="button" data-s="2" aria-label="ok">\u2605</button>' +
    '<button type="button" data-s="3" aria-label="love it">\u2605</button></div>';
  if(!document.getElementById('jsb-fr-css')){
    var css = document.createElement('style'); css.id = 'jsb-fr-css';
    css.textContent = '.jsb-funrate{margin:14px auto 4px;text-align:center;}' +
      '.jsb-fr-q{font-size:12px;letter-spacing:.18em;opacity:.55;margin-bottom:6px;text-transform:uppercase;}' +
      '.jsb-fr-stars{display:flex;gap:10px;justify-content:center;}' +
      '.jsb-fr-stars button{background:none;border:none;font-size:34px;line-height:1;' +
      'color:rgba(255,255,255,.22);cursor:pointer;min-width:52px;min-height:52px;padding:4px;}' +
      '.jsb-fr-stars button:active{transform:scale(1.25);color:#2ee6a8;}' +
      '.jsb-fr-thanks{font-size:13px;letter-spacing:.1em;opacity:.7;}';
    document.head.appendChild(css);
  }
  mountEl.appendChild(box);
  box.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-s]') : null;
    if(!b) return;
    try{ if(window.goatcounter && window.goatcounter.count){
      window.goatcounter.count({ path: '/event/fun/' + slug + '/' + b.getAttribute('data-s'), event: true });
    }}catch(e2){}
    box.innerHTML = '<div class="jsb-fr-thanks">thanks</div>';
    setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); }, 1400);
  });
}
</script>
